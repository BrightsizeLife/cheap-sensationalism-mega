<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Paper by day, night when the device asks (src/styles/tokens.css). A
         meta tag cannot read a CSS token, so these two repeat --pact-bg. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#faf8f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1915" media="(prefers-color-scheme: dark)" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="description" content="Everything Cheap Sensationalism makes: music, instruments, essays, forecasts, tools, and games. Most of it unfinished." />
    <title>cheap sensationalism</title>
    <link rel="preload" href="/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- The design system's [display] script, unchanged: applies a reader's
         saved colours, text size and motion before the first paint. -->
    <script src="/pact-display.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p>This map needs JavaScript to draw itself. The music is at
      <a href="https://open.spotify.com/album/7kjmvtW08iNlCKEU0qgKXN">Spotify</a>, and the essays start at
      <a href="https://weather.cheapsensationalism.com">Weird Weather</a>.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
